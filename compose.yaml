services:
  afraid-sync-v2:
    build: .
    image: afraid-sync-v2:latest
    container_name: afraid-sync-v2
    ports:
      - "7777:7777" # Web UI access
    volumes:
      - ./data:/app/data # Persist settings
    environment:
      # These serve as initial defaults if config.json doesn't exist
      - DDNS_DOMAIN=example.afraid.org
      - UPDATE_URL=https://sync.afraid.org/u/YOUR_UNIQUE_TOKEN_HERE/
      - CHECK_INTERVAL=1800
      - DASHBOARD_USER=admin
      - DASHBOARD_PASS=admin
    restart: unless-stopped
